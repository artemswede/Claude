<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<title>Схема территории ЗТЗ</title>
<desc>GPS-referenced factory map. Geo bounds: latN=56.4335, latS=56.4195, lonW=38.1400, lonE=38.1570. SVG 900x1200.</desc>
<defs>
  <pattern id="grass" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="#d8e4cc"/>
    <circle cx="8" cy="12" r="1.5" fill="#c2d4b0"/>
    <circle cx="22" cy="6" r="1" fill="#c8d8b4"/>
    <circle cx="15" cy="24" r="1.2" fill="#c0d0ae"/>
  </pattern>
  <pattern id="forest" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#9db88e"/>
    <circle cx="6" cy="6" r="5" fill="#7a9c6b" opacity="0.7"/>
    <circle cx="18" cy="8" r="4" fill="#6d8f5e" opacity="0.6"/>
    <circle cx="12" cy="18" r="5.5" fill="#7fa870" opacity="0.7"/>
  </pattern>
  <pattern id="pipes" width="20" height="14" patternUnits="userSpaceOnUse">
    <rect width="20" height="14" fill="#b5a894"/>
    <rect x="1" y="1" width="18" height="5" rx="1" fill="#9a8d7a"/>
    <rect x="1" y="8" width="18" height="5" rx="1" fill="#a8997f"/>
    <path d="M5 1v5M10 1v5M15 1v5M5 8v5M10 8v5M15 8v5" stroke="#7d7263" stroke-width="0.6"/>
  </pattern>
  <pattern id="water" width="40" height="20" patternUnits="userSpaceOnUse">
    <rect width="40" height="20" fill="#8ab4c7"/>
    <path d="M0 10Q10 7 20 10T40 10" fill="none" stroke="#9dc4d4" stroke-width="1.2" opacity="0.5"/>
  </pattern>
  <pattern id="roof" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="#c5c8c3"/>
    <path d="M0 4H16M0 12H16" stroke="#adb2aa" stroke-width="0.8"/>
  </pattern>
  <style>
    .road{fill:none;stroke:#e8e4dc;stroke-linecap:round;stroke-linejoin:round}
    .road-edge{fill:none;stroke:#bfb9ae;stroke-linecap:round;stroke-linejoin:round}
    .building{fill:url(#roof);stroke:#7a8077;stroke-width:1.5}
    .building-small{fill:#c0c4be;stroke:#7a8077;stroke-width:1}
    .label{font-family:Arial,Helvetica,sans-serif;fill:#3a3a3a;font-size:11px;font-weight:bold;text-anchor:middle}
    .label-sm{font-family:Arial,Helvetica,sans-serif;fill:#555;font-size:9px;text-anchor:middle}
    .road-label{font-family:Arial,Helvetica,sans-serif;fill:#666;font-size:8px;text-anchor:middle}
  </style>
</defs>

<!-- Background -->
<rect width="900" height="1200" fill="url(#grass)"/>

<!-- Water body (west side, pond) approx 56.4280-56.4310, 38.1420-38.1460 -->
