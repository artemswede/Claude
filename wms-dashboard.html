<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЗТЗ WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --wms-header: #68503a;
  --wms-header-text: #f5f0eb;
  --wms-accent: #ccb484;
  --wms-accent-hover: #b89e6e;
  --wms-bg: #f0ecea;
  --wms-surface: #ffffff;
  --wms-text: #2d2a26;
  --wms-text-sec: #7a7267;
  --wms-success: #4a7c59;
  --wms-warning: #c4943a;
  --wms-danger: #a94442;
  --wms-border: #d9d2cb;
  --wms-radius: 12px;
  --wms-shadow: 0 2px 8px rgba(45,42,38,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wms-bg: #1a1816;
    --wms-surface: #2a2622;
    --wms-text: #e8e2da;
    --wms-text-sec: #a09688;
    --wms-border: #3d3730;
    --wms-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  --wms-bg: #1a1816;
  --wms-surface: #2a2622;
  --wms-text: #e8e2da;
  --wms-text-sec: #a09688;
  --wms-border: #3d3730;
  --wms-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--wms-bg);
  color: var(--wms-text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* HEADER */
.header {
  background: var(--wms-header);
  color: var(--wms-header-text);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.header-right { display: flex; align-items: center; gap: 8px; }
.mode-toggle {
  display: flex;
  background: rgba(255,255,255,0.12);
  border-radius: 6px;
  overflow: hidden;
  font-size: 11px;
  font-weight: 500;
}
.mode-toggle button {
  border: none;
  background: transparent;
  color: var(--wms-header-text);
  padding: 4px 10px;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.2s;
  font-family: inherit;
}
.mode-toggle button.active {
  background: var(--wms-accent);
  color: var(--wms-text);
  opacity: 1;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--wms-success);
  animation: pulse 2s infinite;
}
.status-dot.stale { background: var(--wms-warning); animation: none; }
.status-dot.error { background: var(--wms-danger); animation: none; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
.update-time { font-size: 10px; opacity: 0.6; }

/* MAIN */
.main { flex: 1; padding: 0 0 68px 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* MAP TAB */
.map-container { padding: 8px 12px; }
.map-wrapper {
  background: var(--wms-surface);
  border-radius: var(--wms-radius);
  box-shadow: var(--wms-shadow);
  overflow: hidden;
  position: relative;
}
.map-wrapper svg.factory-svg {
  width: 100%;
  height: auto;
  display: block;
}
.map-legend {
  display: flex;
  gap: 12px;
  padding: 6px 12px;
  font-size: 10px;
  color: var(--wms-text-sec);
  border-top: 1px solid var(--wms-border);
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.map-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 8px 12px;
}
.stat-card {
  background: var(--wms-surface);
  border-radius: 10px;
  padding: 10px 8px;
  box-shadow: var(--wms-shadow);
  text-align: center;
}
.stat-value { font-size: 22px; font-weight: 700; color: var(--wms-header); line-height: 1; }
.stat-label { font-size: 10px; color: var(--wms-text-sec); margin-top: 3px; }

/* vehicle markers on SVG */
.v-marker { cursor: pointer; }
.v-marker .outer { animation: markerPulse 2s infinite; }
@keyframes markerPulse {
  0%,100% { r: 16; opacity: 0.25; }
  50% { r: 22; opacity: 0.1; }
}
.v-marker.parking .outer { animation: none; r: 16; opacity: 0.15; }
.v-marker .trail { fill: none; stroke-width: 2; stroke-linecap: round; opacity: 0.4; }

/* popup */
.vehicle-popup {
  position: absolute;
  background: var(--wms-surface);
  border-radius: 10px;
  padding: 10px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  font-size: 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 50;
  min-width: 160px;
  border: 1px solid var(--wms-border);
}
.vehicle-popup.show { opacity: 1; }
.vp-plate { font-weight: 600; font-size: 14px; }
.vp-model { color: var(--wms-text-sec); margin-top: 1px; font-size: 11px; }
.vp-status { margin-top: 6px; display: flex; align-items: center; gap: 4px; font-size: 11px; }
.vp-zone { margin-top: 3px; font-size: 11px; color: var(--wms-text-sec); }

/* VEHICLES TAB */
.vehicles-list { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.vehicle-card {
  background: var(--wms-surface);
  border-radius: var(--wms-radius);
  padding: 12px 14px;
  box-shadow: var(--wms-shadow);
  display: flex;
  align-items: center;
  gap: 10px;
}
.v-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--wms-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.v-icon svg { width: 20px; height: 20px; }
.v-info { flex: 1; min-width: 0; }
.v-plate { font-weight: 600; font-size: 13px; }
.v-model { font-size: 11px; color: var(--wms-text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-meta { display: flex; gap: 10px; margin-top: 3px; font-size: 10px; color: var(--wms-text-sec); }
.v-badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.v-badge.moving { background: #e8f5e9; color: var(--wms-success); }
.v-badge.parking { background: #fff3e0; color: var(--wms-warning); }
.v-badge.no_data { background: #fce4ec; color: var(--wms-danger); }

/* TRIPS TAB */
.trips-header { padding: 20px 16px 12px; text-align: center; }
.shift-label { font-size: 11px; color: var(--wms-text-sec); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
.trip-count { font-size: 52px; font-weight: 700; color: var(--wms-header); line-height: 1.1; }
.trip-unit { font-size: 13px; color: var(--wms-text-sec); }
.trips-routes { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.route-card {
  background: var(--wms-surface);
  border-radius: var(--wms-radius);
  padding: 12px 14px;
  box-shadow: var(--wms-shadow);
}
.route-name { font-weight: 600; font-size: 13px; }
.route-bar { height: 5px; background: var(--wms-bg); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.route-bar-fill { height: 100%; background: var(--wms-accent); border-radius: 3px; transition: width 0.8s ease; }
.route-meta { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--wms-text-sec); }

/* NAV BAR */
.nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--wms-surface);
  border-top: 1px solid var(--wms-border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 0 5px;
  border: none;
  background: transparent;
  color: var(--wms-text-sec);
  font-size: 10px;
  font-family: inherit;
  cursor: pointer;
  transition: color 0.2s;
  gap: 1px;
}
.nav-btn.active { color: var(--wms-header); }
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn span { font-weight: 500; }
</style>
</head>
<body>

<div class="header">
  <h1>ЗТЗ Транспорт</h1>
  <div class="header-right">
    <span class="update-time" id="updateTime">--:--</span>
    <div class="mode-toggle">
      <button id="modeDemo" class="active" onclick="setMode('demo')">Demo</button>
      <button id="modeLive" onclick="setMode('live')">Live</button>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<div class="main">
  <!-- MAP TAB -->
  <div class="tab-content active" id="tabMap">
    <div class="map-container">
      <div class="map-wrapper" id="mapWrapper">
        <div class="vehicle-popup" id="vehiclePopup">
          <div class="vp-plate" id="vpPlate"></div>
          <div class="vp-model" id="vpModel"></div>
          <div class="vp-status" id="vpStatus"></div>
          <div class="vp-zone" id="vpZone"></div>
        </div>
        <div class="map-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--wms-success)"></div>В движении</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--wms-warning)"></div>Стоянка</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--wms-danger)"></div>Нет связи</div>
        </div>
      </div>
    </div>
    <div class="map-stats">
      <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Всего ТС</div></div>
      <div class="stat-card"><div class="stat-value" id="statMoving">0</div><div class="stat-label">В пути</div></div>
      <div class="stat-card"><div class="stat-value" id="statParking">0</div><div class="stat-label">Стоянка</div></div>
      <div class="stat-card"><div class="stat-value" id="statTrips">0</div><div class="stat-label">Рейсов</div></div>
    </div>
  </div>

  <!-- VEHICLES TAB -->
  <div class="tab-content" id="tabVehicles">
    <div class="vehicles-list" id="vehiclesList"></div>
  </div>

  <!-- TRIPS TAB -->
  <div class="tab-content" id="tabTrips">
    <div class="trips-header">
      <div class="shift-label">Текущая смена</div>
      <div class="trip-count" id="tripTotal">0</div>
      <div class="trip-unit">рейсов выполнено</div>
    </div>
    <div class="trips-routes" id="tripsRoutes"></div>
  </div>
</div>

<nav class="nav-bar">
  <button class="nav-btn active" data-tab="tabMap" onclick="switchTab('tabMap',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    <span>Карта</span>
  </button>
  <button class="nav-btn" data-tab="tabVehicles" onclick="switchTab('tabVehicles',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    <span>Машины</span>
  </button>
  <button class="nav-btn" data-tab="tabTrips" onclick="switchTab('tabTrips',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span>Рейсы</span>
  </button>
</nav>

<script>
// ========== GEO-REFERENCE ==========
// ZTZ factory approximate geo bounds (from satellite imagery)
// SVG viewBox: 0 0 806 1344
// Top-left corner (NW):  lat 56.2895, lon 38.1720
// Bottom-right (SE):     lat 56.2830, lon 38.1810
const GEO = {
  latN: 56.2895, latS: 56.2830,
  lonW: 38.1720, lonE: 38.1810,
  svgW: 806, svgH: 1344,
};
function geoToSvg(lat, lon) {
  const x = ((lon - GEO.lonW) / (GEO.lonE - GEO.lonW)) * GEO.svgW;
  const y = ((GEO.latN - lat) / (GEO.latN - GEO.latS)) * GEO.svgH;
  return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
}

// ========== ZONES on SVG (approximate SVG coords) ==========
const ZONES = {
  'КПП':        { cx: 200, cy: 1280 },
  'ТЭСЦ':      { cx: 480, cy: 140 },
  'Склад труб': { cx: 370, cy: 400 },
  'Весовая':    { cx: 490, cy: 970 },
  'Склад ГП':  { cx: 640, cy: 830 },
  'Цех':       { cx: 340, cy: 830 },
  'Погрузка':  { cx: 350, cy: 1170 },
};

// Waypoint paths between zones (SVG coords along roads from the real map)
const ROAD_PATHS = {
  'КПП→Склад труб': [[200,1280],[236,1240],[205,1102],[205,900],[205,716],[205,483],[337,478],[344,400]],
  'Склад труб→ТЭСЦ': [[370,400],[380,350],[400,285],[482,230],[480,140]],
  'ТЭСЦ→Весовая':  [[480,140],[482,230],[482,714],[484,716],[440,800],[440,900],[490,970]],
  'Весовая→КПП':   [[490,970],[440,1000],[343,1099],[343,1100],[236,1240],[200,1280]],
  'Склад ГП→КПП':  [[640,830],[591,901],[563,902],[343,902],[343,1099],[236,1240],[200,1280]],
  'КПП→Погрузка':  [[200,1280],[236,1240],[350,1238],[350,1170]],
  'ТЭСЦ→Склад ГП': [[480,140],[482,230],[532,264],[532,903],[591,901],[640,830]],
  'Погрузка→КПП':  [[350,1170],[350,1238],[236,1240],[200,1280]],
  'Склад труб→Весовая': [[370,400],[400,450],[400,483],[594,483],[595,477],[591,716],[591,901],[563,902],[490,970]],
};
const ROUTE_NAMES = Object.keys(ROAD_PATHS);

// ========== MOCK VEHICLES (expanded to 12) ==========
const MOCK_VEHICLES = [
  { id:'d1',  plate:'А 123 МО 50', model:'КАМАЗ 65115',   state:'moving',  speed:18, distance:12.4 },
  { id:'d2',  plate:'В 456 КА 50', model:'МАЗ 6430',      state:'moving',  speed:22, distance:8.7  },
  { id:'d3',  plate:'Е 789 ТР 50', model:'КАМАЗ 53215',   state:'parking', speed:0,  distance:15.1 },
  { id:'d4',  plate:'К 012 ЗТ 50', model:'Volvo FH16',    state:'moving',  speed:15, distance:22.3 },
  { id:'d5',  plate:'М 345 РО 50', model:'Scania R440',   state:'parking', speed:0,  distance:5.6  },
  { id:'d6',  plate:'Н 678 АП 50', model:'КАМАЗ 6520',    state:'moving',  speed:20, distance:18.9 },
  { id:'d7',  plate:'О 901 ВК 50', model:'MAN TGS',       state:'moving',  speed:12, distance:9.2  },
  { id:'d8',  plate:'Р 234 ЕМ 50', model:'DAF XF',        state:'parking', speed:0,  distance:3.1  },
  { id:'d9',  plate:'С 567 НТ 50', model:'КАМАЗ 65201',   state:'moving',  speed:25, distance:31.4 },
  { id:'d10', plate:'Т 890 ОР 50', model:'Iveco Stralis', state:'parking', speed:0,  distance:7.8  },
  { id:'d11', plate:'У 111 ПЛ 50', model:'МАЗ 5440',      state:'moving',  speed:16, distance:14.5 },
  { id:'d12', plate:'Х 222 СК 50', model:'КАМАЗ 54901',   state:'moving',  speed:19, distance:20.1 },
];

let mode = 'demo';
let vehicles = [];
let svgEl = null;
let markersGroup = null;
let animRunning = false;
let pollTimer = null;

// ========== INIT ==========
async function init() {
  await loadSvgMap();
  loadDemo();
}

async function loadSvgMap() {
  try {
    const resp = await fetch('ztz-map.svg');
    const text = await resp.text();
    const wrapper = document.getElementById('mapWrapper');
    const legendEl = wrapper.querySelector('.map-legend');
    const popupEl = wrapper.querySelector('.vehicle-popup');
    const div = document.createElement('div');
    div.innerHTML = text;
    svgEl = div.querySelector('svg');
    svgEl.classList.add('factory-svg');
    // add markers group
    markersGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    markersGroup.id = 'vehicleMarkers';
    svgEl.appendChild(markersGroup);
    wrapper.insertBefore(svgEl, popupEl);
  } catch(e) {
    console.error('SVG load failed, using inline fallback', e);
    createFallbackMap();
  }
}

function createFallbackMap() {
  const wrapper = document.getElementById('mapWrapper');
  const popupEl = wrapper.querySelector('.vehicle-popup');
  svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl.setAttribute('viewBox', '0 0 806 1344');
  svgEl.classList.add('factory-svg');
  svgEl.innerHTML = `<rect width="806" height="1344" fill="#e8e4df"/>
    <text x="403" y="672" text-anchor="middle" font-size="20" fill="#999">Карта не загружена</text>`;
  markersGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  markersGroup.id = 'vehicleMarkers';
  svgEl.appendChild(markersGroup);
  wrapper.insertBefore(svgEl, popupEl);
}

// ========== MODE ==========
function setMode(m) {
  mode = m;
  document.getElementById('modeDemo').classList.toggle('active', m === 'demo');
  document.getElementById('modeLive').classList.toggle('active', m === 'live');
  clearTimeout(pollTimer);
  if (m === 'live') fetchLive();
  else loadDemo();
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ========== DEMO DATA ==========
function loadDemo() {
  vehicles = MOCK_VEHICLES.map((v, i) => {
    const routeName = ROUTE_NAMES[i % ROUTE_NAMES.length];
    const path = ROAD_PATHS[routeName];
    const startPt = path[0];
    return {
      ...v,
      x: startPt[0], y: startPt[1],
      vx: 0, vy: 0,             // velocity for inertia
      heading: 0,                // direction in radians
      trail: [startPt.slice()],  // trail of last N positions
      routeName,
      path: path.map(p => p.slice()),
      wpIdx: 0,
      progress: 0,
      zoneName: routeName.split('→')[0],
    };
  });
  updateStats();
  renderVehiclesList();
  renderTrips();
  renderMarkers();
  updateTime();
  document.getElementById('statusDot').className = 'status-dot';
  if (!animRunning) { animRunning = true; animate(); }
}

// ========== LIVE DATA ==========
async function fetchLive() {
  const dot = document.getElementById('statusDot');
  try {
    const ts1 = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    const ts2 = new Date().toISOString().slice(0,10);
    const res = await fetch(`/api/agr?report=route/summary&ts_start=${ts1}&ts_stop=${ts2}&offset_utc=3`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      vehicles = data.map((d, i) => {
        const routeName = ROUTE_NAMES[i % ROUTE_NAMES.length];
        const path = ROAD_PATHS[routeName];
        const pos = path[0];
        return {
          id: d.device_id || 'd'+i,
          plate: d.state_number || '???',
          model: [d.vehicle_manufacturer, d.vehicle_model].filter(Boolean).join(' ') || '—',
          state: (d.moving_time > 0 && d.parking_time < d.moving_time) ? 'moving' : 'parking',
          speed: d.speed_max || 0,
          distance: ((d.race||0)/1000).toFixed(1),
          x: pos[0], y: pos[1],
          vx: 0, vy: 0,
          heading: 0,
          trail: [pos.slice()],
          routeName,
          path: path.map(p => p.slice()),
          wpIdx: 0,
          zoneName: routeName.split('→')[0],
        };
      });
      dot.className = 'status-dot';
    } else {
      dot.className = 'status-dot stale';
      if (!vehicles.length) loadDemo();
    }
    updateStats();
    renderVehiclesList();
    renderMarkers();
    updateTime();
    if (!animRunning) { animRunning = true; animate(); }
  } catch(e) {
    dot.className = 'status-dot error';
    if (!vehicles.length) loadDemo();
  }
  pollTimer = setTimeout(fetchLive, 45000);
}

// ========== ANIMATION with INERTIA ==========
const ANIM_INTERVAL = 80;  // ms between frames
const SPEED_PX = 4;        // base px per frame
const INERTIA = 0.7;       // velocity smoothing (0=instant, 1=no change)
const TRAIL_LEN = 8;       // trail points to keep

function animate() {
  vehicles.forEach(v => {
    if (v.state !== 'moving') {
      // parked vehicles occasionally start moving
      if (Math.random() < 0.003) {
        v.state = 'moving';
        v.wpIdx = 0;
        const newRoute = ROUTE_NAMES[Math.floor(Math.random() * ROUTE_NAMES.length)];
        v.routeName = newRoute;
        v.path = ROAD_PATHS[newRoute].map(p => p.slice());
        const start = v.path[0];
        v.x = start[0]; v.y = start[1];
        v.trail = [start.slice()];
      }
      return;
    }

    if (v.wpIdx >= v.path.length) {
      // arrived at destination
      v.state = 'parking';
      v.speed = 0;
      v.vx = 0; v.vy = 0;
      v.zoneName = v.routeName.split('→')[1] || v.routeName.split('→')[0];
      return;
    }

    const [tx, ty] = v.path[v.wpIdx];
    const dx = tx - v.x;
    const dy = ty - v.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const speed = SPEED_PX + Math.random() * 2;

    if (dist < speed) {
      v.x = tx;
      v.y = ty;
      v.wpIdx++;
    } else {
      const targetVx = (dx / dist) * speed;
      const targetVy = (dy / dist) * speed;
      v.vx = v.vx * INERTIA + targetVx * (1 - INERTIA);
      v.vy = v.vy * INERTIA + targetVy * (1 - INERTIA);
      v.x += v.vx;
      v.y += v.vy;
      v.heading = Math.atan2(v.vy, v.vx);
    }

    v.speed = Math.floor(8 + Math.random() * 22);

    // trail
    v.trail.push([v.x, v.y]);
    if (v.trail.length > TRAIL_LEN) v.trail.shift();

    // update marker position
    const marker = document.getElementById('marker-' + v.id);
    if (marker) {
      marker.setAttribute('transform', `translate(${v.x.toFixed(1)},${v.y.toFixed(1)})`);
      // update trail path
      const trailEl = marker.querySelector('.trail');
      if (trailEl && v.trail.length > 1) {
        const pts = v.trail.map((p, i) => `${i === 0 ? 'M' : 'L'}${(p[0]-v.x).toFixed(1)},${(p[1]-v.y).toFixed(1)}`).join(' ');
        trailEl.setAttribute('d', pts);
      }
    }
  });

  // periodic UI updates
  if (Math.random() < 0.05) {
    updateStats();
    renderVehiclesList();
  }

  setTimeout(() => requestAnimationFrame(animate), ANIM_INTERVAL);
}

// ========== RENDER MARKERS ==========
function renderMarkers() {
  if (!markersGroup) return;
  markersGroup.innerHTML = '';
  vehicles.forEach(v => {
    const color = v.state === 'moving' ? '#4a7c59' : v.state === 'parking' ? '#c4943a' : '#a94442';
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'marker-' + v.id;
    g.classList.add('v-marker');
    if (v.state !== 'moving') g.classList.add('parking');
    g.setAttribute('transform', `translate(${v.x},${v.y})`);

    g.innerHTML = `
      <path class="trail" d="" stroke="${color}"/>
      <circle class="outer" r="16" fill="${color}" opacity="0.25"/>
      <circle r="8" fill="${color}" stroke="#fff" stroke-width="2"/>
      <polygon points="0,-5 4,3 -4,3" fill="#fff" opacity="0.9" transform="rotate(${(v.heading||0)*180/Math.PI})"/>
    `;

    g.addEventListener('pointerenter', e => showPopup(v, e));
    g.addEventListener('pointerleave', hidePopup);
    markersGroup.appendChild(g);
  });
}

function showPopup(v, e) {
  const popup = document.getElementById('vehiclePopup');
  document.getElementById('vpPlate').textContent = v.plate;
  document.getElementById('vpModel').textContent = v.model;
  const stText = v.state === 'moving' ? 'В движении' : 'Стоянка';
  const stColor = v.state === 'moving' ? 'var(--wms-success)' : 'var(--wms-warning)';
  document.getElementById('vpStatus').innerHTML =
    `<span style="width:6px;height:6px;border-radius:50%;background:${stColor};display:inline-block"></span> ${stText}` +
    (v.speed > 0 ? ` · ${v.speed} км/ч` : '');
  document.getElementById('vpZone').textContent = v.zoneName ? `Зона: ${v.zoneName}` : '';

  const rect = document.getElementById('mapWrapper').getBoundingClientRect();
  const svgRect = svgEl.getBoundingClientRect();
  const scaleX = svgRect.width / GEO.svgW;
  const scaleY = svgRect.height / GEO.svgH;
  const px = v.x * scaleX + (svgRect.left - rect.left);
  const py = v.y * scaleY + (svgRect.top - rect.top);
  popup.style.left = Math.min(Math.max(px + 15, 5), rect.width - 175) + 'px';
  popup.style.top = Math.max(py - 50, 5) + 'px';
  popup.classList.add('show');
}

function hidePopup() { document.getElementById('vehiclePopup').classList.remove('show'); }

// ========== STATS ==========
function updateStats() {
  const moving = vehicles.filter(v => v.state === 'moving').length;
  const parking = vehicles.filter(v => v.state !== 'moving').length;
  document.getElementById('statTotal').textContent = vehicles.length;
  document.getElementById('statMoving').textContent = moving;
  document.getElementById('statParking').textContent = parking;
  document.getElementById('statTrips').textContent = Math.floor(vehicles.length * 3.2);
}

function updateTime() {
  const now = new Date();
  document.getElementById('updateTime').textContent =
    now.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(updateTime, 1000);

// ========== VEHICLES LIST ==========
function renderVehiclesList() {
  const list = document.getElementById('vehiclesList');
  list.innerHTML = vehicles.map(v => `
    <div class="vehicle-card">
      <div class="v-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="${v.state==='moving'?'var(--wms-success)':'var(--wms-warning)'}" stroke-width="2">
          <rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/>
          <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <div class="v-info">
        <div class="v-plate">${v.plate}</div>
        <div class="v-model">${v.model}</div>
        <div class="v-meta">
          <span>${v.speed} км/ч</span>
          <span>${v.distance} км</span>
          <span>${v.zoneName || '—'}</span>
        </div>
      </div>
      <div class="v-badge ${v.state}">${v.state==='moving'?'В пути':'Стоит'}</div>
    </div>
  `).join('');
}

// ========== TRIPS ==========
const TRIP_ROUTES = [
  { name: 'Склад труб → КПП', count: 12, max: 20 },
  { name: 'КПП → Склад труб', count: 11, max: 20 },
  { name: 'ТЭСЦ → Весовая', count: 8, max: 15 },
  { name: 'Весовая → КПП', count: 7, max: 15 },
  { name: 'Склад ГП → КПП', count: 6, max: 12 },
  { name: 'ТЭСЦ → Склад ГП', count: 5, max: 10 },
  { name: 'КПП → Погрузка', count: 4, max: 8 },
];

function renderTrips() {
  const total = TRIP_ROUTES.reduce((s,r) => s + r.count, 0);
  document.getElementById('tripTotal').textContent = total;
  document.getElementById('tripsRoutes').innerHTML = TRIP_ROUTES.map(r => `
    <div class="route-card">
      <div class="route-name">${r.name}</div>
      <div class="route-bar"><div class="route-bar-fill" style="width:${(r.count/r.max*100).toFixed(0)}%"></div></div>
      <div class="route-meta"><span>${r.count} рейсов</span><span>план: ${r.max}</span></div>
    </div>
  `).join('');
}

// ========== START ==========
init();
</script>
