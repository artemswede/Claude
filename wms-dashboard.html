<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЗТЗ WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --wms-header: #68503a;
  --wms-header-text: #f5f0eb;
  --wms-accent: #ccb484;
  --wms-bg: #f0ecea;
  --wms-surface: #ffffff;
  --wms-text: #2d2a26;
  --wms-text-sec: #7a7267;
  --wms-success: #4a7c59;
  --wms-warning: #c4943a;
  --wms-danger: #a94442;
  --wms-border: #d9d2cb;
  --wms-radius: 12px;
  --wms-shadow: 0 2px 8px rgba(45,42,38,0.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wms-bg:#1a1816;--wms-surface:#2a2622;--wms-text:#e8e2da;
  --wms-text-sec:#a09688;--wms-border:#3d3730;--wms-shadow:0 2px 8px rgba(0,0,0,0.3);
}}
:root[data-theme="dark"]{
  --wms-bg:#1a1816;--wms-surface:#2a2622;--wms-text:#e8e2da;
  --wms-text-sec:#a09688;--wms-border:#3d3730;--wms-shadow:0 2px 8px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--wms-bg);color:var(--wms-text);min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.header{background:var(--wms-header);color:var(--wms-header-text);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.header h1{font-size:15px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px}
.mode-toggle{display:flex;background:rgba(255,255,255,0.12);border-radius:6px;overflow:hidden;font-size:11px;font-weight:500}
.mode-toggle button{border:none;background:transparent;color:var(--wms-header-text);padding:4px 10px;cursor:pointer;opacity:0.5;transition:all .2s;font-family:inherit}
.mode-toggle button.active{background:var(--wms-accent);color:var(--wms-text);opacity:1}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--wms-success);animation:pulse 2s infinite}
.status-dot.stale{background:var(--wms-warning);animation:none}
.status-dot.error{background:var(--wms-danger);animation:none}
.status-dot.loading{background:var(--wms-accent);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.update-time{font-size:10px;opacity:.6}
.main{flex:1;padding:0 0 68px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab-content{display:none}.tab-content.active{display:block}
.map-container{padding:8px 12px}
.map-wrapper{background:var(--wms-surface);border-radius:var(--wms-radius);box-shadow:var(--wms-shadow);overflow:hidden;position:relative}
.map-wrapper svg.factory-svg{width:100%;height:auto;display:block}
.map-legend{display:flex;gap:12px;padding:6px 12px;font-size:10px;color:var(--wms-text-sec);border-top:1px solid var(--wms-border);flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.map-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px}
.stat-card{background:var(--wms-surface);border-radius:10px;padding:10px 8px;box-shadow:var(--wms-shadow);text-align:center}
.stat-value{font-size:22px;font-weight:700;color:var(--wms-header);line-height:1}
.stat-label{font-size:10px;color:var(--wms-text-sec);margin-top:3px}
.v-marker{cursor:pointer}
.v-marker .pulse-ring{animation:markerPulse 2s infinite}
.v-marker.parking .pulse-ring{animation:none;opacity:.1}
@keyframes markerPulse{0%,100%{r:12;opacity:.15}50%{r:16;opacity:.05}}
.vehicle-popup{position:absolute;background:var(--wms-surface);border-radius:10px;padding:10px 14px;box-shadow:0 4px 20px rgba(0,0,0,.18);font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:50;min-width:170px;border:1px solid var(--wms-border)}
.vehicle-popup.show{opacity:1}
.vp-plate{font-weight:600;font-size:14px}
.vp-model{color:var(--wms-text-sec);margin-top:1px;font-size:11px}
.vp-status{margin-top:6px;display:flex;align-items:center;gap:4px;font-size:11px}
.vp-extra{margin-top:3px;font-size:10px;color:var(--wms-text-sec)}
.vehicles-list{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.vehicle-card{background:var(--wms-surface);border-radius:var(--wms-radius);padding:12px 14px;box-shadow:var(--wms-shadow);display:flex;align-items:center;gap:10px}
.v-icon{width:36px;height:36px;border-radius:8px;background:var(--wms-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v-icon svg{width:20px;height:20px}
.v-info{flex:1;min-width:0}
.v-plate{font-weight:600;font-size:13px}
.v-model{font-size:11px;color:var(--wms-text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-meta{display:flex;gap:10px;margin-top:3px;font-size:10px;color:var(--wms-text-sec)}
.v-badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;flex-shrink:0}
.v-badge.moving{background:#e8f5e9;color:var(--wms-success)}
.v-badge.parking{background:#fff3e0;color:var(--wms-warning)}
.v-badge.no_data{background:#fce4ec;color:var(--wms-danger)}
.v-badge.off_site{background:#e3e8f0;color:#5b7095}
.trips-header{padding:20px 16px 12px;text-align:center}
.shift-label{font-size:11px;color:var(--wms-text-sec);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.trip-count{font-size:52px;font-weight:700;color:var(--wms-header);line-height:1.1}
.trip-unit{font-size:13px;color:var(--wms-text-sec)}
.trips-routes{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.route-card{background:var(--wms-surface);border-radius:var(--wms-radius);padding:12px 14px;box-shadow:var(--wms-shadow)}
.route-name{font-weight:600;font-size:13px}
.route-bar{height:5px;background:var(--wms-bg);border-radius:3px;margin-top:6px;overflow:hidden}
.route-bar-fill{height:100%;background:var(--wms-accent);border-radius:3px;transition:width .8s ease}
.route-meta{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--wms-text-sec)}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--wms-surface);border-top:1px solid var(--wms-border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;border:none;background:transparent;color:var(--wms-text-sec);font-size:10px;font-family:inherit;cursor:pointer;transition:color .2s;gap:1px}
.nav-btn.active{color:var(--wms-header)}
.nav-btn svg{width:20px;height:20px}
.nav-btn span{font-weight:500}
.error-banner{background:#fff3e0;color:#7a5a00;padding:8px 12px;font-size:12px;text-align:center;display:none}
.error-banner.show{display:block}
</style>
</head>
<body>

<div class="header">
  <h1>ЗТЗ Транспорт</h1>
  <div class="header-right">
    <span class="update-time" id="updateTime">--:--</span>
    <span style="font-size:10px;opacity:.7">Live</span>
    <div class="status-dot loading" id="statusDot"></div>
  </div>
</div>

<div class="error-banner" id="errorBanner"></div>

<div class="main">
  <div class="tab-content active" id="tabMap">
    <div class="map-container">
      <div class="map-wrapper" id="mapWrapper">
        <div class="vehicle-popup" id="vehiclePopup">
          <div class="vp-plate" id="vpPlate"></div>
          <div class="vp-model" id="vpModel"></div>
          <div class="vp-status" id="vpStatus"></div>
          <div class="vp-extra" id="vpExtra"></div>
        </div>
        <div class="map-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--wms-success)"></div>В движении</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--wms-warning)"></div>Стоянка</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--wms-danger)"></div>Нет связи</div>
          <div class="legend-item"><div class="legend-dot" style="background:#5b7095"></div>Вне территории</div>
        </div>
      </div>
    </div>
    <div class="map-stats">
      <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">Всего ТС</div></div>
      <div class="stat-card"><div class="stat-value" id="statMoving">-</div><div class="stat-label">В пути</div></div>
      <div class="stat-card"><div class="stat-value" id="statParking">-</div><div class="stat-label">Стоянка</div></div>
      <div class="stat-card"><div class="stat-value" id="statOnSite">-</div><div class="stat-label">На заводе</div></div>
    </div>
  </div>

  <div class="tab-content" id="tabVehicles">
    <div class="vehicles-list" id="vehiclesList"></div>
  </div>

  <div class="tab-content" id="tabTrips">
    <div class="trips-header">
      <div class="shift-label">Текущая смена</div>
      <div class="trip-count" id="tripTotal">-</div>
      <div class="trip-unit">рейсов выполнено</div>
    </div>
    <div class="trips-routes" id="tripsRoutes"></div>
  </div>
</div>

<nav class="nav-bar">
  <button class="nav-btn active" onclick="switchTab('tabMap',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    <span>Карта</span>
  </button>
  <button class="nav-btn" onclick="switchTab('tabVehicles',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    <span>Машины</span>
  </button>
  <button class="nav-btn" onclick="switchTab('tabTrips',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span>Рейсы</span>
  </button>
</nav>

<script>
// ========== CONFIG ==========
const API_BASE = '/api/agr';
const POLL_INTERVAL = 45000;
const CORRECTION_DURATION = 2000; // ms to ease correction after new GPS

// ========== GEO-REFERENCE ==========
// Real vehicle coordinates: lat 56.421..56.431, lng 38.144..38.153
// SVG viewBox: 0 0 900 1200
const GEO = {
  latN: 56.4345,
  latS: 56.4175,
  lonW: 38.1375,
  lonE: 38.1565,
  svgW: 900,
  svgH: 1200,
};

function geoToSvg(lat, lon) {
  const x = ((lon - GEO.lonW) / (GEO.lonE - GEO.lonW)) * GEO.svgW;
  const y = ((GEO.latN - lat) / (GEO.latN - GEO.latS)) * GEO.svgH;
  return [x, y];
}

function isOnSite(lat, lon) {
  return lat > 56.419 && lat < 56.434 && lon > 38.140 && lon < 38.158;
}

// Scale: how many SVG pixels per km
// Longitude span: (38.1565-38.1375)° at lat ~56.43 ≈ 0.019° * 111.32 * cos(56.43°) ≈ 1.17 km → 900 px
// Latitude span: (56.4345-56.4175)° ≈ 0.017° * 111.32 ≈ 1.89 km → 1200 px
const KM_TO_PX_X = 900 / 1.17;  // ~769 px/km
const KM_TO_PX_Y = 1200 / 1.89; // ~635 px/km
const KM_TO_PX = (KM_TO_PX_X + KM_TO_PX_Y) / 2; // ~702 px/km

// ========== STATE ==========
let vehicles = [];
let svgEl = null;
let markersGroup = null;
let pollTimer = null;
let animRunning = false;
let lastFrameTime = 0;

// ========== INIT ==========
async function init() {
  await loadSvgMap();
  fetchData();
}

async function loadSvgMap() {
  const wrapper = document.getElementById('mapWrapper');
  const popup = wrapper.querySelector('.vehicle-popup');
  const legend = wrapper.querySelector('.map-legend');
  try {
    const resp = await fetch('ztz-map.svg');
    const text = await resp.text();
    const div = document.createElement('div');
    div.innerHTML = text;
    svgEl = div.querySelector('svg');
    svgEl.classList.add('factory-svg');
  } catch(e) {
    svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgEl.setAttribute('viewBox', '0 0 806 1344');
    svgEl.classList.add('factory-svg');
    svgEl.innerHTML = '<rect width="806" height="1344" fill="#e8e4df"/><text x="403" y="672" text-anchor="middle" font-size="18" fill="#999">Карта загружается...</text>';
  }
  markersGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  markersGroup.id = 'vehicleMarkers';
  svgEl.appendChild(markersGroup);
  wrapper.insertBefore(svgEl, popup);
}

// ========== EXCLUDED MODELS ==========
const EXCLUDED_MODELS = ['GAC G8', 'GAC  G8'];

function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ========== FETCH ==========
async function fetchData() {
  const dot = document.getElementById('statusDot');
  const banner = document.getElementById('errorBanner');
  dot.className = 'status-dot loading';

  const now = Math.floor(Date.now() / 1000);
  const todayStart = now - (now % 86400) - 3 * 3600; // midnight MSK approx
  const tsStart = Math.max(todayStart, now - 86400);

  try {
    const res = await fetch(`${API_BASE}?report=route/detail&ts_start=${tsStart}&ts_stop=${now}&offset_utc=3&with_track=true`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (!Array.isArray(data) || data.length === 0) {
      dot.className = 'status-dot stale';
      banner.textContent = 'Нет данных за сегодня';
      banner.classList.add('show');
      pollTimer = setTimeout(fetchData, POLL_INTERVAL);
      return;
    }

    const filtered = data.filter(d => {
      const m = [d.vehicle_manufacturer, d.vehicle_model].filter(Boolean).join(' ').trim();
      return !EXCLUDED_MODELS.some(ex => m.includes(ex));
    });
    processApiData(filtered);
    dot.className = 'status-dot';
    banner.classList.remove('show');
    updateTime();
  } catch(e) {
    console.error('API error:', e);
    dot.className = 'status-dot error';
    banner.textContent = 'Ошибка API: ' + e.message;
    banner.classList.add('show');
  }

  pollTimer = setTimeout(fetchData, POLL_INTERVAL);
}

function processApiData(data) {
  const oldMap = new Map(vehicles.map(v => [v.id, v]));

  vehicles = data.map(d => {
    const track = Array.isArray(d.track) ? d.track : [];
    const events = Array.isArray(d.events) ? d.events : [];
    const lastPoint = track.length > 0 ? track[track.length - 1] : null;
    const lastEvent = events.length > 0 ? events[events.length - 1] : {};
    const lat = lastPoint ? lastPoint.lat : 0;
    const lon = lastPoint ? lastPoint.lng : 0;
    const onSite = isOnSite(lat, lon);
    const [sx, sy] = onSite ? geoToSvg(lat, lon) : [0, 0];
    const old = oldMap.get(d.device_id);

    let state = lastEvent.event_type || 'no_data';
    if (state !== 'moving' && state !== 'parking') state = 'no_data';
    if (!lastPoint) state = 'no_data';

    const lastEventTime = lastEvent.ts_stop || lastEvent.ts_start || 0;
    const bestTime = Math.max(lastPoint ? (lastPoint.packet_time || 0) : 0, lastEventTime);

    const speedKmh = lastPoint ? (lastPoint.speed || 0) : 0;
    const headingRad = lastPoint ? ((lastPoint.az || 0) * Math.PI / 180) : 0;
    const speedPxPerSec = (speedKmh / 3600) * KM_TO_PX;

    // Dead-reckoning velocity in SVG px/s
    const drVx = speedPxPerSec * Math.sin(headingRad);
    const drVy = -speedPxPerSec * Math.cos(headingRad);

    // Correction: difference between real GPS position and current predicted position
    const nowMs = performance.now();
    let corrX = 0, corrY = 0, corrStart = 0;
    if (old && old.onSite && onSite) {
      corrX = sx - old.x;
      corrY = sy - old.y;
      corrStart = nowMs;
    }

    return {
      id: d.device_id,
      plate: d.state_number || '???',
      model: [d.vehicle_manufacturer, d.vehicle_model].filter(Boolean).join(' ') || '—',
      state,
      speed: speedKmh,
      heading: headingRad,
      distance: ((d.distance || 0) / 1000).toFixed(1),
      lat, lon,
      x: old ? old.x : sx,
      y: old ? old.y : sy,
      drVx, drVy,
      corrX, corrY, corrStart,
      onSite,
      trackPoints: track.length,
      lastTime: bestTime,
      eventsCount: events.length,
    };
  });

  updateStats();
  renderMarkers();
  renderVehiclesList();
  renderTrips();
  startAnimation();
}

// ========== ANIMATION (dead reckoning + correction easing) ==========
function startAnimation() {
  if (animRunning) return;
  animRunning = true;
  lastFrameTime = performance.now();
  requestAnimationFrame(tick);
}

function tick(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.5);
  lastFrameTime = now;

  vehicles.forEach(v => {
    if (!v.onSite) return;
    if (v.state !== 'moving' || v.speed === 0) {
      // Apply remaining correction for stopped vehicles
      if (v.corrX !== 0 || v.corrY !== 0) {
        const elapsed = now - v.corrStart;
        const t = Math.min(elapsed / CORRECTION_DURATION, 1);
        if (t < 1) {
          const eased = t * (2 - t); // ease-out
          const marker = document.getElementById('m-' + v.id);
          if (marker) {
            const cx = v.corrX * eased;
            const cy = v.corrY * eased;
            marker.setAttribute('transform', `translate(${(v.x + cx - v.corrX + v.corrX).toFixed(1)},${(v.y + cy - v.corrY + v.corrY).toFixed(1)})`);
          }
        } else {
          v.x += v.corrX;
          v.y += v.corrY;
          v.corrX = 0; v.corrY = 0;
          const marker = document.getElementById('m-' + v.id);
          if (marker) marker.setAttribute('transform', `translate(${v.x.toFixed(1)},${v.y.toFixed(1)})`);
        }
      }
      return;
    }

    // Dead reckoning: move along speed+heading vector
    v.x += v.drVx * dt;
    v.y += v.drVy * dt;

    // Ease in correction from last GPS update
    if (v.corrX !== 0 || v.corrY !== 0) {
      const elapsed = now - v.corrStart;
      const t = Math.min(elapsed / CORRECTION_DURATION, 1);
      const step = dt / (CORRECTION_DURATION / 1000);
      if (t < 1) {
        v.x += v.corrX * step;
        v.y += v.corrY * step;
      } else {
        v.corrX = 0;
        v.corrY = 0;
      }
    }

    const marker = document.getElementById('m-' + v.id);
    if (marker) marker.setAttribute('transform', `translate(${v.x.toFixed(1)},${v.y.toFixed(1)})`);
  });

  requestAnimationFrame(tick);
}

// ========== RENDER MARKERS ==========
function renderMarkers() {
  if (!markersGroup) return;
  markersGroup.innerHTML = '';
  vehicles.forEach(v => {
    if (!v.onSite) return;
    const colors = { moving: '#4a7c59', parking: '#c4943a', no_data: '#a94442' };
    const c = colors[v.state] || colors.no_data;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'm-' + v.id;
    g.classList.add('v-marker');
    if (v.state !== 'moving') g.classList.add('parking');
    g.setAttribute('transform', `translate(${v.x.toFixed(1)},${v.y.toFixed(1)})`);

    g.innerHTML = `
      <circle class="pulse-ring" r="12" fill="${c}" opacity=".15"/>
      <circle r="8" fill="${c}" stroke="#fff" stroke-width="2"/>
      <polygon points="0,-4 3,1.5 -3,1.5" fill="#fff" opacity=".9" transform="rotate(${(v.heading*180/Math.PI).toFixed(0)})"/>
    `;
    g.addEventListener('pointerenter', e => showPopup(v));
    g.addEventListener('pointerleave', hidePopup);
    markersGroup.appendChild(g);
  });
}

// ========== POPUP ==========
function showPopup(v) {
  const popup = document.getElementById('vehiclePopup');
  document.getElementById('vpPlate').textContent = v.plate;
  document.getElementById('vpModel').textContent = v.model;
  const stLabel = {moving:'В движении', parking:'Стоянка', no_data:'Нет данных'}[v.state] || v.state;
  const stColor = {moving:'var(--wms-success)', parking:'var(--wms-warning)', no_data:'var(--wms-danger)'}[v.state];
  document.getElementById('vpStatus').innerHTML =
    `<span style="width:6px;height:6px;border-radius:50%;background:${stColor};display:inline-block"></span> ${stLabel}` +
    (v.speed > 0 ? ` &middot; ${v.speed} км/ч` : '');
  const ago = v.lastTime ? Math.round((Date.now()/1000 - v.lastTime)/60) : 0;
  document.getElementById('vpExtra').textContent =
    `${v.distance} км` + (ago > 0 ? ` · ${ago} мин назад` : '') + ` · ${v.trackPoints} точек`;

  const rect = document.getElementById('mapWrapper').getBoundingClientRect();
  const svgRect = svgEl.getBoundingClientRect();
  const sx = svgRect.width / GEO.svgW;
  const sy = svgRect.height / GEO.svgH;
  const px = v.x * sx + (svgRect.left - rect.left);
  const py = v.y * sy + (svgRect.top - rect.top);
  popup.style.left = Math.min(Math.max(px + 18, 5), rect.width - 185) + 'px';
  popup.style.top = Math.max(py - 55, 5) + 'px';
  popup.classList.add('show');
}
function hidePopup() { document.getElementById('vehiclePopup').classList.remove('show'); }

// ========== STATS ==========
function updateStats() {
  const moving = vehicles.filter(v => v.state === 'moving').length;
  const parking = vehicles.filter(v => v.state === 'parking').length;
  const onSite = vehicles.filter(v => v.onSite).length;
  document.getElementById('statTotal').textContent = vehicles.length;
  document.getElementById('statMoving').textContent = moving;
  document.getElementById('statParking').textContent = parking;
  document.getElementById('statOnSite').textContent = onSite;
}

function updateTime() {
  document.getElementById('updateTime').textContent =
    new Date().toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateTime, 1000);

// ========== VEHICLES LIST ==========
function renderVehiclesList() {
  document.getElementById('vehiclesList').innerHTML = vehicles
    .sort((a,b) => (a.state==='moving'?0:1) - (b.state==='moving'?0:1))
    .map(v => {
    const stateClass = !v.onSite ? 'off_site' : v.state;
    const stateLabel = !v.onSite ? 'Вне зав.' : v.state==='moving' ? 'В пути' : v.state==='parking' ? 'Стоит' : 'Нет связи';
    const sColor = v.state==='moving' ? 'var(--wms-success)' : 'var(--wms-warning)';
    const ago = v.lastTime ? Math.round((Date.now()/1000 - v.lastTime)/60) : null;
    return `<div class="vehicle-card">
      <div class="v-icon"><svg viewBox="0 0 24 24" fill="none" stroke="${sColor}" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
      <div class="v-info">
        <div class="v-plate">${v.plate}</div>
        <div class="v-model">${v.model}</div>
        <div class="v-meta">
          ${v.speed > 0 ? `<span>${v.speed} км/ч</span>` : ''}
          <span>${v.distance} км</span>
          ${ago !== null ? `<span>${ago} мин</span>` : ''}
        </div>
      </div>
      <div class="v-badge ${stateClass}">${stateLabel}</div>
    </div>`;
  }).join('');
}

// ========== TRIPS ==========
function renderTrips() {
  const evTotal = vehicles.reduce((s,v) => s + v.eventsCount, 0);
  const movingEvents = vehicles.reduce((s,v) => s + (v.state==='moving' ? v.eventsCount : 0), 0);
  const tripEstimate = Math.round(evTotal / 3);
  document.getElementById('tripTotal').textContent = tripEstimate;

  const routes = vehicles
    .filter(v => v.eventsCount > 2)
    .sort((a,b) => b.eventsCount - a.eventsCount)
    .slice(0, 8)
    .map(v => ({
      name: `${v.plate} (${v.model})`,
      count: Math.round(v.eventsCount / 2),
      max: Math.round(v.eventsCount / 2) + 5,
    }));

  document.getElementById('tripsRoutes').innerHTML = routes.map(r => `
    <div class="route-card">
      <div class="route-name">${r.name}</div>
      <div class="route-bar"><div class="route-bar-fill" style="width:${(r.count/r.max*100).toFixed(0)}%"></div></div>
      <div class="route-meta"><span>${r.count} рейсов</span><span>план: ${r.max}</span></div>
    </div>
  `).join('');
}

init();
</script>
