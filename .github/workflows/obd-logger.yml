name: Bortach APK

on:
  push:
    paths:
      - "obd-logger/**"
      - ".github/workflows/obd-logger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obd-logger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Version = build time in Moscow, e.g. 20261003_2247 (app «Settings» and the file name show it).
      - name: Version
        run: echo "BORTACH_VERSION=$(TZ=Europe/Moscow date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"

      - name: Unit tests and APK
        run: |
          ./gradlew --no-daemon :obd-core:test :app:assembleDebug :app:lintDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null
            exit 1
          }

      # Every screen rendered on sample trips (Robolectric); published for review.
      - name: Screenshots
        id: screens
        continue-on-error: true
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest
          # The trip report and the plan as PDF, printed by Chrome like the app's WebView does.
          R="$PWD/app/build/screens/report"
          cp -r app/src/main/assets/fonts "$R/"
          for f in trip_report plan; do
            google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="$R/$f.pdf" "file://$R/$f.html" || true
          done
          cd app/build/screens && zip -qr "../../../screens-${BORTACH_VERSION}.zip" .

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Bortach-${BORTACH_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Bortach-${{ env.BORTACH_VERSION }}
          path: obd-logger/Bortach-${{ env.BORTACH_VERSION }}.apk

      # One rolling release that always holds only the newest APK.
      - name: Remove the previous APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view bortach-latest >/dev/null 2>&1; then
            gh release view bortach-latest --json assets -q '.assets[].name' | while read -r a; do
              gh release delete-asset bortach-latest "$a" -y
            done
          fi

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bortach-latest
          name: Бортач ${{ env.BORTACH_VERSION }}
          prerelease: true
          overwrite_files: true
          body: |
            Бортач ${{ env.BORTACH_VERSION }} — сборка ${{ github.run_number }} (${{ github.sha }}).
            Скачайте Bortach-${{ env.BORTACH_VERSION }}.apk и установите поверх прежней версии.
          files: obd-logger/Bortach-${{ env.BORTACH_VERSION }}.apk

      - name: Publish screenshots
        if: steps.screens.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view bortach-screens >/dev/null 2>&1; then
            gh release view bortach-screens --json assets -q '.assets[].name' | while read -r a; do
              gh release delete-asset bortach-screens "$a" -y
            done
            gh release upload bortach-screens "screens-${BORTACH_VERSION}.zip"
          else
            gh release create bortach-screens "screens-${BORTACH_VERSION}.zip" --prerelease \
              --title "Бортач: скриншоты экранов" --notes "Все экраны на тестовых поездках, для проверки вёрстки." --target "$GITHUB_SHA"
          fi
