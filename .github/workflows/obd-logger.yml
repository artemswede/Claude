name: OBD Logger APK

on:
  push:
    paths:
      - "obd-logger/**"
      - ".github/workflows/obd-logger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obd-logger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew --no-daemon :obd-core:test :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk obd-logger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: obd-logger-apk
          path: obd-logger/obd-logger.apk

      # Stable download link for the phone: Releases → obd-logger-latest → obd-logger.apk
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: obd-logger-latest
          name: OBD Logger (последняя сборка)
          prerelease: true
          overwrite_files: true
          body: |
            Сборка ${{ github.run_number }} из ветки ${{ github.ref_name }} (${{ github.sha }}).
            Скачайте obd-logger.apk на телефон и установите (разрешите установку из неизвестных источников).
          files: obd-logger/obd-logger.apk
